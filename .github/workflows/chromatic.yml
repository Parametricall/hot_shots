name: Chromatic

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Chromatic needs full history to compute baselines and TurboSnap diffs.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Pinned, not @latest, so a new Chromatic release can't change CI unannounced. The
      # action bundles the Chromatic CLI: bump it with the chromatic devDependency.
      - uses: chromaui/action@v18.15.1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          exitZeroOnChanges: true
          autoAcceptChanges: main
